<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Store Checkout System</title>

<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: 30px auto;
    padding: 0 20px;
    color: #222;
  }

  h1 {
    text-align: center;
    letter-spacing: 1px;
  }

  .field {
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-weight: bold;
    margin-bottom: 4px;
  }

  input,
  select {
    padding: 6px 8px;
    width: 100%;
    max-width: 300px;
    box-sizing: border-box;
  }

  .product-block {
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 12px;
    background: #fafafa;
  }

  button {
    padding: 10px 18px;
    margin-top: 10px;
    cursor: pointer;
  }

  #validationMessage {
    color: #b00020;
    font-weight: bold;
    margin: 10px 0;
    min-height: 1.2em;
  }

  #orderSummary {
    white-space: pre-wrap;
    background: #f4f4f4;
    border-radius: 6px;
    padding: 16px;
    margin-top: 16px;
    font-family: monospace;
  }
</style>
</head>

<body>

<h1>MINI STORE CHECKOUT SYSTEM</h1>

<div class="field">
  <label for="customerName">Customer Name</label>
  <input type="text" id="customerName" placeholder="Enter customer name">
</div>

<div class="field">
  <label for="productCount">Number of Products</label>
  <input type="number" id="productCount" min="1" placeholder="Enter number of products">
</div>

<div id="productsContainer"></div>

<div class="field">
  <label for="deliveryOption">Delivery Option</label>
  <select id="deliveryOption">
    <option value="1">Store Pickup (₱0)</option>
    <option value="2">Standard Delivery (₱80)</option>
    <option value="3">Express Delivery (₱150)</option>
  </select>
</div>

<button id="calculateBtn">Calculate Order</button>

<div id="validationMessage"></div>
<div id="orderSummary"></div>

<script src="script.js"></script>

</body>
</html>
