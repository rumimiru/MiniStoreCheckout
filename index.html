<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MINI STORE CHECKOUT SYSTEM</title>
</head>
<body>

  <h1>MINI STORE CHECKOUT SYSTEM</h1>

  <label for="customerName">Customer Name</label><br>
  <input type="text" id="customerName"><br><br>

  <label for="productCount">Number of Products</label><br>
  <input type="number" id="productCount" min="1"><br><br>

  <div id="productsContainer"></div><br>

  <label for="deliveryOption">Delivery Option</label><br>
  <select id="deliveryOption">
    <option value="1">Store Pickup</option>
    <option value="2">Standard Delivery</option>
    <option value="3">Express Delivery</option>
  </select><br><br>

  <button id="calculateBtn">Calculate Order</button><br><br>

  <div id="validationMessage"></div>
  <pre id="orderSummary"></pre>

  <script src="script.js"></script>
</body>
</html>
